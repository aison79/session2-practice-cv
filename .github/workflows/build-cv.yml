name: Build LaTeX CV

on:
  push:
    branches: [main]
    paths:
      - main.tex
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended

      - name: Compile CV
        run: pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Upload CV PDF
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: main.pdf
          if-no-files-found: error
